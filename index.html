<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>StudentHub</h1>
        <p>Student Information Portal</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Welcome to StudentHub</h2>
            <p>
                A simple platform for managing and accessing
                student information.
            </p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>Students</h3>
                <p>View and manage student information.</p>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <p>View available courses and programmes.</p>
            </div>

            <div class="card">
                <h3>Results</h3>
                <p>Access student academic results.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>StudentHub &copy; 2026</p>
    </footer>

</body>
</html>
